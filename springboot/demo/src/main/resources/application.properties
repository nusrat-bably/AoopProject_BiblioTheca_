# Bind to Railway's dynamic port, falling back to 8080 locally
server.port=${PORT:8080}

spring.application.name=demo

# Supabase uses PostgreSQL. Set these values from the Supabase Connect dialog
# or provide SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and
# SPRING_DATASOURCE_PASSWORD in the backend environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Google Gemini API Configuration (SECURED)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent